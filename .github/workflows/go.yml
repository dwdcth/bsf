name: Go
on: [push, pull_request]
jobs:

  build:
    name: Build/Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        go-version: [stable, oldstable]
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
      id: go

    - name: Build
      run: go build -v ./...

    - name: Build stripped binary (bsf)
      run: go build -trimpath -ldflags "-s -w" -o bsf${{ runner.os == 'Windows' && '.exe' || '' }} .

    - name: Show binary size
      run: ls -lh bsf
      if: ${{ runner.os == 'Linux' }}

    - name: Package binary (tar.gz)
      run: tar -czf bsf-${{ runner.os }}.tar.gz bsf${{ runner.os == 'Windows' && '.exe' || '' }}

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: bsf-${{ matrix.go-version }}-${{ runner.os }}
        path: bsf-${{ runner.os }}.tar.gz

    - name: Test
      shell: bash
      run: |
        set -o pipefail
        go test -v ./... --timeout 120s 2>&1 | tee test-amd64.out

    - name: Dump test output on failure
      if: failure()
      shell: bash
      run: |
        echo '### Failed test output (test-amd64.out)' >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        grep -E "^(--- FAIL|FAIL|panic|# |.*\.go:[0-9]+:)" test-amd64.out | head -100 >> "$GITHUB_STEP_SUMMARY" || true
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Meta Tests
      run: go test -v -tags ci ./ci --timeout 60s
      if: ${{ runner.os == 'Linux' && matrix.go-version == 'stable' }}

    - name: Race Tests
      run: go test -race -count=1 ./wormhole/ ./cmd/ --timeout 300s
      if: ${{ runner.os == 'Linux' && matrix.go-version == 'stable' }}

    - name: Cross test for i386
      shell: bash
      run: |
        set -o pipefail
        env GOOS=linux GOARCH=386 go test -v ./... --timeout 120s 2>&1 | tee test-386.out
      if: ${{ runner.os == 'Linux' }}

    - name: Dump 386 test output on failure
      if: ${{ failure() && runner.os == 'Linux' }}
      shell: bash
      run: |
        echo '### Failed 386 test output (test-386.out)' >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        grep -E "^(--- FAIL|FAIL|panic|# |.*\.go:[0-9]+:)" test-386.out | head -100 >> "$GITHUB_STEP_SUMMARY" || true
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Cross compile for arm (RPI)
      run: env GOOS=linux GOARCH=arm GOARM=5 go build -v ./...
      if: ${{ runner.os == 'Linux' }}
