name: Go
on: [push, pull_request]
jobs:

  build:
    name: Build/Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    strategy:
      matrix:
        go-version: [stable, oldstable]
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
      id: go

    - name: Build
      run: go build -v ./...

    - name: Build stripped binary (bsf)
      run: go build -trimpath -ldflags "-s -w" -o bsf${{ runner.os == 'Windows' && '.exe' || '' }} .

    - name: Show binary size
      run: ls -lh bsf
      if: ${{ runner.os == 'Linux' }}

    - name: Package binary (tar.gz)
      run: tar -czf bsf-${{ runner.os }}.tar.gz bsf${{ runner.os == 'Windows' && '.exe' || '' }}

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: bsf-${{ matrix.go-version }}-${{ runner.os }}
        path: bsf-${{ runner.os }}.tar.gz

    - name: Test
      run: go test -v ./... --timeout 60s

    - name: Meta Tests
      run: go test -v -tags ci ./ci --timeout 60s
      if: ${{ runner.os == 'Linux' }}

    - name: Cross test for i386
      run: env GOOS=linux GOARCH=386 go test -v ./... --timeout 60s
      if: ${{ runner.os == 'Linux' }}

    - name: Cross compile for arm (RPI)
      run: env GOOS=linux GOARCH=arm GOARM=5 go build -v ./...
      if: ${{ runner.os == 'Linux' }}
